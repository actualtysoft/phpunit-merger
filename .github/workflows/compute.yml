name: ✏️ matrix

on:
    workflow_call:
        outputs:
            os:
                value: ${{ jobs.compute.outputs.os }}
            coverage:
                value: ${{ jobs.compute.outputs.coverage }}
            major:
                value: ${{ jobs.compute.outputs.major }}
            php:
                value: ${{ jobs.compute.outputs.php }}
            exclude:
                value: ${{ jobs.compute.outputs.exclude }}
            major_exclude:
                value: ${{ jobs.compute.outputs.major_exclude }}

env:
    OS: '[ "ubuntu-latest" ]'
    COVERAGE: '[ "~11.0.12", "~12.5.7", "~13.0.2" ]'
    PHP: '[ "8.3", "8.4", "8.5" ]'
    EXCLUDE: '[ { "coverage": "~11.0.12", "php": "8.5" }, { "coverage": "~13.0.2", "php": "8.3" } ]'
    MAJOR_EXCLUDE: '[ { "coverage": "11", "php": "8.5" }, { "coverage": "13", "php": "8.3" } ]'

jobs:
    compute:
        name: Compute outputs

        runs-on: ubuntu-latest

        outputs:
            os: ${{ env.OS }}
            coverage: ${{ env.COVERAGE }}
            major: ${{ steps.major-version.outputs.major  }}
            php: ${{ env.PHP }}
            exclude: ${{ env.EXCLUDE }}
            major_exclude: ${{ env.MAJOR_EXCLUDE }}

        steps:
            -   name: Compute major versions
                id: major-version
                run: |
                    echo -e "COVERAGE\n"
                    echo $COVERAGE
                    echo -e "\n\nSplit by comma\n"
                    echo $COVERAGE | tr "," "\n"
                    echo -e "\n\nStrip brackets, quotes and spaces\n"
                    echo $COVERAGE | tr "," "\n" | tr -d ' "[]'
                    echo -e "\n\nStrip range operator\n"
                    echo $COVERAGE | tr "," "\n" | tr -d ' "[]' | sed "s/^[~^]//"
                    echo -e "\n\nCut at first dot\n"
                    echo $COVERAGE | tr "," "\n" | tr -d ' "[]' | sed "s/^[~^]//" | cut -d. -f1
                    echo -e "\n\nSort by version\n"
                    echo $COVERAGE | tr "," "\n" | tr -d ' "[]' | sed "s/^[~^]//" | cut -d. -f1 | sort -V
                    echo -e "\n\nUnique values only\n"
                    echo $COVERAGE | tr "," "\n" | tr -d ' "[]' | sed "s/^[~^]//" | cut -d. -f1 | sort -V | uniq
                    echo -e "\n\nCovert to JSON\n"
                    echo $COVERAGE | tr "," "\n" | tr -d ' "[]' | sed "s/^[~^]//" | cut -d. -f1 | sort -V | uniq | jq --compact-output --raw-input --slurp 'split("\n") | map(select(. != ""))'
                    echo "major=$(echo $COVERAGE | tr "," "\n" | tr -d ' "[]' | sed "s/^[~^]//" | cut -d. -f1 | sort -V | uniq | jq --compact-output --raw-input --slurp 'split("\n") | map(select(. != ""))')" >> $GITHUB_OUTPUT
